# Custom Java Security Properties for SQL Server TLS 1.0 Support
# This file overrides the default disabledAlgorithms to allow TLSv1 and TLSv1.1

# Original: jdk.tls.disabledAlgorithms=SSLv3, TLSv1, TLSv1.1, RC4, DES, MD5withRSA, \
#      DH keySize < 1024, EC keySize < 224, 3DES_EDE_CBC, anon, NULL, \
#      include jdk.disabled.namedCurves
#
# Modified: Removed TLSv1 and TLSv1.1 from disabled algorithms
jdk.tls.disabledAlgorithms=SSLv3, RC4, DES, MD5withRSA, \
     DH keySize < 1024, EC keySize < 224, 3DES_EDE_CBC, anon, NULL, \
     include jdk.disabled.namedCurves

# Enable legacy TLS protocols
jdk.tls.client.protocols=TLSv1,TLSv1.1,TLSv1.2,TLSv1.3
