spring:
  application:
    name: langchain4j-2

server:
  port: 8080

langchain4j:
  open-ai:
    chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${QWEN_API_KEY}
      model-name: qwen-plus
      log-responses: true
      log-requests: true
  community:
    dashscope:
      chat-model:
        api-key:  ${QWEN_API_KEY}
        model-name: qwen-plus

logging:
  level:
    dev.langchain4j: debug
    root: info
